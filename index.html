<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Finance | Halal Stock Screener</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2a2a2a; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 4px solid #d4af37; }
        h1 { color: #d4af37; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 0.9em; color: #a0a0a0; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #e0e0e0; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #444; border-radius: 5px; background-color: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #d4af37; color: #1a1a1a; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #b5952f; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .halal { background-color: #2e4a2e; color: #90ee90; border: 1px solid #90ee90; }
        .haram { background-color: #4a2e2e; color: #ffcccb; border: 1px solid #ffcccb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Noor Finance</h1>
        <p class="subtitle">Islamic Finance Analysis Tool</p>
        
        <label>Company Name</label>
        <input type="text" id="company" placeholder="e.g. Tech Corp">
        
        <label>Total Interest-Bearing Debt ($)</label>
        <input type="number" id="debt" placeholder="e.g. 5000000">
        
        <label>Market Capitalization ($)</label>
        <input type="number" id="marketCap" placeholder="e.g. 25000000">
        
        <button onclick="checkCompliance()">Run Analysis</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function checkCompliance() {
            const company = document.getElementById('company').value;
            const debt = document.getElementById('debt').value;
            const marketCap = document.getElementById('marketCap').value;

            const response = await fetch('/screen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company: company, debt: debt, market_cap: marketCap })
            });

            const data = await response.json();
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `${data.company}<br>${data.status}<br><span style="font-size:0.8em; font-weight:normal;">${data.message}</span>`;
            
            if (data.status.includes('Halal')) {
                resultDiv.className = 'halal';
            } else {
                resultDiv.className = 'haram';
            }
        }
    </script>
</body>
</html>

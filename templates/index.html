<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Finance | Live Halal Screener</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2a2a2a; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 4px solid #d4af37; }
        h1 { color: #d4af37; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 0.9em; color: #a0a0a0; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #e0e0e0; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #444; border-radius: 5px; background-color: #333; color: white; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #d4af37; color: #1a1a1a; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #b5952f; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; display: none; }
        .halal { background-color: #2e4a2e; color: #90ee90; border: 1px solid #90ee90; }
        .haram { background-color: #4a2e2e; color: #ffcccb; border: 1px solid #ffcccb; }
        .error { background-color: #4a3e2e; color: #ffebcc; border: 1px solid #ffebcc; }
        .data-row { display: flex; justify-content: space-between; font-size: 0.85em; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Noor Finance</h1>
        <p class="subtitle">Live Islamic Market Screener</p>
        
        <label>Enter Stock Ticker (e.g. AAPL, TSLA, MSFT)</label>
        <input type="text" id="ticker" placeholder="Ticker Symbol">
        
        <button onclick="checkLiveCompliance()">Fetch Live Data & Analyze</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function checkLiveCompliance() {
            const ticker = document.getElementById('ticker').value;
            const resultDiv = document.getElementById('result');
            
            if(!ticker) return;

            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = 'Fetching live market data...';

            const response = await fetch('/screen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker: ticker })
            });

            const data = await response.json();
            
            if(data.error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = data.error;
                return;
            }
            
            let htmlContent = `<strong>${data.company} (${data.ticker})</strong><br>
                               <span style="font-size:1.2em; font-weight:bold; display:block; margin: 10px 0;">${data.status}</span>
                               <span style="font-size:0.85em;">${data.message}</span>
                               <div class="data-row"><span>Market Cap:</span> <span>${data.market_cap}</span></div>
                               <div class="data-row"><span>Total Debt:</span> <span>${data.total_debt}</span></div>`;
            
            resultDiv.innerHTML = htmlContent;
            
            if (data.status.includes('Halal')) {
                resultDiv.className = 'halal';
            } else {
                resultDiv.className = 'haram';
            }
        }
    </script>
</body>
</html>

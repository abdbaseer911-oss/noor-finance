<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Finance | Terminal</title>
    <style>
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: #050505; 
            color: #d4af37; 
            margin: 0; 
            padding: 40px; 
        }
        .header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        .system-status { font-size: 12px; color: #00ff00; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            color: #e0e0e0;
        }
        th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #444;
            color: #888;
            font-weight: normal;
            font-size: 14px;
        }
        td {
            padding: 15px 12px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 16px;
        }
        .ticker { font-weight: bold; color: #fff; }
        
        /* Terminal Colors */
        .halal { color: #00ff00; font-weight: bold; }
        .haram { color: #ff0000; font-weight: bold; }
        .error { color: #ff9900; }
        
        #loader {
            color: #d4af37;
            text-align: center;
            margin-top: 50px;
            font-size: 18px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>NOOR FINANCE // TERMINAL</h1>
        <div class="system-status">SYS: ONLINE // FETCHING LIVE DATA</div>
    </div>

    <div id="loader">CONNECTING TO MARKET DATA...</div>

    <table id="dashboard" style="display:none;">
        <thead>
            <tr>
                <th>TICKER</th>
                <th>LAST PRICE</th>
                <th>MARKET CAP</th>
                <th>DEBT/EQUITY</th>
                <th>SHARIA COMPLIANCE</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = ''; // Clear loading text
                
                data.forEach(stock => {
                    const row = `<tr>
                        <td class="ticker">${stock.ticker}</td>
                        <td>${stock.price}</td>
                        <td>${stock.market_cap}</td>
                        <td>${stock.debt_ratio}</td>
                        <td class="${stock.status_class}">${stock.status}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard').style.display = 'table';
                document.querySelector('.system-status').innerText = 'SYS: ONLINE // DATA SYNCED';

            } catch (error) {
                document.getElementById('loader').innerText = 'SYS ERROR: UNABLE TO CONNECT TO EXCHANGE';
                document.getElementById('loader').style.color = '#ff0000';
            }
        }

        // Load data immediately when page opens
        window.onload = loadDashboard;
    </script>

</body>
</html>
